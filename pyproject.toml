[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "document-intelligence-pipeline"
version = "1.0.0"
description = "Evidence-first extraction from invoices and OCR output"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "cmiedema25-rgb" }]
keywords = ["document-ai", "information-extraction", "ocr", "python", "typescript"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5.0,<7"]
dev = ["pytest>=8.0,<10", "pytest-cov>=5.0,<8", "ruff>=0.8,<1"]

[project.scripts]
docintel = "document_intelligence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/document_intelligence"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
